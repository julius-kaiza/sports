<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPulse Sports Portal | Uganda & International Hub</title>
    
    <meta property="og:title" content="ProPulse Sports Portal | Live News & Updates">
    <meta property="og:description" content="Catch the latest Ugandan and international sports news, live feeds, player profiles, and VIP tips in real-time.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1200&auto=format&fit=crop">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 pb-32 font-sans antialiased selection:bg-amber-500 selection:text-slate-950" x-data="sportsPortal()">

    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col md:flex-row justify-between items-center gap-3">
            <h1 class="text-2xl font-black text-amber-400 tracking-wider flex items-center gap-2">
                <span>PRO</span><span class="text-white">PULSE</span>
                <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full font-semibold">LIVE HUB</span>
            </h1>
            
            <nav class="flex flex-wrap justify-center gap-2 text-xs font-bold uppercase tracking-wide">
                <button @click="activeTab = 'feed'" :class="activeTab === 'feed' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 scale-105' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700'" class="px-3.5 py-2 rounded-xl transition duration-200">🔥 Live Feed</button>
                <button @click="activeTab = 'uganda'" :class="activeTab === 'uganda' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 scale-105' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700'" class="px-3.5 py-2 rounded-xl transition duration-200">🇺🇬 Ugandan Sports</button>
                <button @click="activeTab = 'international'" :class="activeTab === 'international' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 scale-105' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700'" class="px-3.5 py-2 rounded-xl transition duration-200">🌍 International</button>
                <button @click="activeTab = 'players'" :class="activeTab === 'players' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 scale-105' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700'" class="px-3.5 py-2 rounded-xl transition duration-200">⭐ Player Profiles</button>
                <button @click="activeTab = 'tips'" :class="activeTab === 'tips' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 scale-105' : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700'" class="px-3.5 py-2 rounded-xl transition duration-200">💎 VIP Tips</button>
            </nav>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <aside class="space-y-4 order-2 lg:order-1">
            <div class="lg:sticky lg:top-24 space-y-4">
                <div class="text-[10px] uppercase font-extrabold text-slate-500 tracking-widest text-center">Sponsored Partners</div>
                <template x-for="ad in data.adverts" :key="'left-' + ad.id">
                    <div class="bg-gradient-to-b from-slate-900 to-slate-900/80 border border-slate-800/80 rounded-2xl p-4 space-y-3 shadow-xl relative group overflow-hidden">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-amber-500/5 rounded-full blur-2xl group-hover:bg-amber-500/10 transition"></div>
                        <div class="flex justify-between items-center text-[10px] font-bold text-amber-400 uppercase tracking-wider relative z-10">
                            <span x-text="ad.title"></span>
                            <span class="bg-amber-950/80 px-2 py-0.5 rounded border border-amber-800/40 text-amber-300">Ad</span>
                        </div>
                        <template x-if="ad.media_url">
                            <div class="overflow-hidden rounded-xl border border-slate-800 bg-slate-950 relative z-10 shadow-inner">
                                <template x-if="ad.media_url.endsWith('.mp4') || ad.media_url.includes('video')">
                                    <video :src="ad.media_url" autoplay muted loop playsinline class="w-full h-40 object-cover"></video>
                                </template>
                                <template x-if="!ad.media_url.endsWith('.mp4') && !ad.media_url.includes('video')">
                                    <img :src="ad.media_url" :alt="ad.title" loading="lazy" class="w-full h-40 object-cover group-hover:scale-105 transition duration-500">
                                </template>
                            </div>
                        </template>
                        <p class="text-xs text-slate-300 leading-relaxed relative z-10" x-text="ad.body"></p>
                        <template x-if="ad.target_url && ad.target_url.trim() !== ''">
                            <a :href="ad.target_url" target="_blank" class="block text-center bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs py-2.5 rounded-xl transition duration-200 shadow-md relative z-10">Visit Sponsor ➔</a>
                        </template>
                        <template x-if="userRole === 'admin' && isLoggedIn">
                            <button @click="deleteAdvert(ad.id)" class="w-full bg-red-950/80 hover:bg-red-900 text-red-400 text-[10px] font-bold py-1.5 rounded-lg border border-red-800/40 mt-2 transition">Remove Ad</button>
                        </template>
                    </div>
                </template>
            </div>
        </aside>

        <main class="lg:col-span-2 space-y-6 order-1 lg:order-2">

            <div class="space-y-6">
                <template x-for="item in filteredPosts" :key="item.id">
                    <article class="bg-slate-900/90 backdrop-blur border border-slate-800/80 p-6 rounded-3xl space-y-4 shadow-2xl relative group hover:border-slate-700 transition duration-300">
                        <div class="flex justify-between items-center text-xs">
                            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full font-black uppercase tracking-wider text-[10px]" x-text="item.type"></span>
                            <span class="text-emerald-400 font-bold flex items-center gap-1.5 bg-emerald-950/40 border border-emerald-800/30 px-2.5 py-1 rounded-full text-[11px]">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span x-text="'By ' + item.author"></span>
                            </span>
                        </div>

                        <h2 class="text-xl md:text-2xl font-black text-white tracking-tight leading-snug group-hover:text-amber-300 transition" x-text="item.title"></h2>

                        <div x-show="item.media_url && item.type !== 'news-link'" class="overflow-hidden rounded-2xl border border-slate-800/80 bg-slate-950 shadow-inner">
                            <template x-if="item.media_url && (item.media_url.endsWith('.mp4') || item.media_url.includes('video') || item.media_url.includes('giphy'))">
                                <video :src="item.media_url" autoplay muted loop playsinline class="w-full max-h-[480px] object-cover"></video>
                            </template>
                            <template x-if="item.media_url && !(item.media_url.endsWith('.mp4') || item.media_url.includes('video') || item.media_url.includes('giphy'))">
                                <img :src="item.media_url" :alt="item.title" loading="lazy" class="w-full max-h-[480px] object-cover group-hover:scale-[1.02] transition duration-700">
                            </template>
                        </div>

                        <template x-if="item.type === 'news-link'">
                            <div class="bg-slate-950/90 border border-slate-800 p-5 rounded-2xl space-y-3 shadow-inner">
                                <div class="flex items-center gap-2 text-amber-400 text-xs font-bold uppercase tracking-wider">
                                    <span>🌐 External Newspaper Article Preview</span>
                                </div>
                                <h3 class="text-base font-bold text-white" x-text="item.title"></h3>
                                <p class="text-xs text-slate-300 line-clamp-3 leading-relaxed" x-text="item.body"></p>
                                <a :href="item.media_url" target="_blank" class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black px-4 py-2.5 rounded-xl transition duration-200 shadow-md">Read Full Story on Source Site ➔</a>
                            </div>
                        </template>

                        <p class="text-sm text-slate-300 whitespace-pre-line leading-relaxed font-normal" x-text="item.body" x-show="item.type !== 'news-link'"></p>
                        
                        <div class="pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-3 text-xs">
                            <a :href="'https://api.whatsapp.com/send?text=' + encodeURIComponent('🔥 *' + item.title + '*\n\nRead more on ProPulse Sports Portal: ' + window.location.href)" 
                               target="_blank" 
                               class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-slate-950 font-bold px-3.5 py-2 rounded-xl border border-emerald-500/30 flex items-center gap-2 transition duration-200 shadow-sm">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                                <span>Share to WhatsApp</span>
                            </a>

                            <template x-if="isLoggedIn && (userRole === 'admin' || currentUsername === item.author)">
                                <div class="flex gap-2">
                                    <template x-if="userRole === 'admin'">
                                        <button @click="editPost(item)" class="bg-amber-950/80 hover:bg-amber-900 text-amber-400 text-xs px-3 py-1.5 rounded-lg border border-amber-800/40 font-bold transition">Edit</button>
                                    </template>
                                    <button @click="deletePost(item.id)" class="bg-red-950/80 hover:bg-red-900 text-red-400 text-xs px-3 py-1.5 rounded-lg border border-red-800/40 font-bold transition">Delete</button>
                                </div>
                            </template>
                        </div>
                    </article>
                </template>
            </div>

            <div x-show="activeTab === 'tips'" class="space-y-6">
                <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-amber-500/40 p-8 rounded-3xl text-center space-y-4 shadow-2xl relative overflow-hidden">
                    <div class="absolute -top-12 -right-12 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl"></div>
                    <span class="text-xs bg-amber-950 text-amber-400 border border-amber-800/40 px-3 py-1 rounded-full font-extrabold uppercase tracking-widest">VIP Accumulator Hub</span>
                    <h2 class="text-2xl md:text-3xl font-black text-white tracking-tight">Unlock High-Odds Winning Slips</h2>
                    <p class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">Instant secure access via Google Pay payment gateway integration with verified high-success rates.</p>
                    <button @click="triggerGooglePay" class="bg-white hover:bg-slate-200 text-slate-950 font-black px-8 py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2 mx-auto transition duration-200 shadow-xl scale-100 hover:scale-105">
                        <span>Pay Securely with 🌐 Google Pay</span>
                    </button>
                </div>
            </div>

            <section x-show="activeTab === 'admin'" class="space-y-6">
                <div class="bg-slate-900 border border-amber-500/40 p-6 rounded-3xl shadow-xl space-y-6">
                    
                    <template x-if="!isLoggedIn">
                        <div class="space-y-4 text-center py-4">
                            <h2 class="text-xl font-black text-white">Studio Control Center</h2>
                            <p class="text-xs text-slate-400 leading-relaxed">Accessible from any device (Phone, Tablet, PC).<br>Default SuperAdmin: <code class="text-amber-400 font-bold">SuperAdmin</code> / PIN: <code class="text-amber-400 font-bold">1234</code></p>
                            <form @submit.prevent="login" class="space-y-3 text-left max-w-md mx-auto">
                                <input type="text" x-model="loginForm.username" placeholder="Username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition">
                                <input type="password" x-model="loginForm.pin" placeholder="PIN Code / Password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition">
                                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl text-xs transition shadow-lg">Authenticate Access</button>
                            </form>
                        </div>
                    </template>

                    <template x-if="isLoggedIn">
                        <div class="space-y-6">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                                <div>
                                    <span class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800/40 px-2.5 py-1 rounded font-black uppercase tracking-wider" x-text="userRole"></span>
                                    <h2 class="text-lg font-black text-white mt-1" x-text="'Welcome, ' + currentUsername"></h2>
                                </div>
                                <button @click="logout" class="bg-red-950 hover:bg-red-900 text-red-400 text-xs px-3.5 py-2 rounded-xl border border-red-800/40 font-bold transition">Sign Out</button>
                            </div>

                            <form @submit.prevent="publishContent" class="space-y-4 bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner">
                                <h3 class="text-sm font-bold text-white tracking-wide" x-text="postPayload.id ? 'Edit Story / Video' : 'Publish Story, Video, or Newspaper Link'"></h3>
                                
                                <div>
                                    <label class="text-[10px] text-slate-400 font-extrabold uppercase block mb-1 tracking-wider">Select Category</label>
                                    <select x-model="postType" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 outline-none focus:border-amber-500 transition">
                                        <option value="uganda">🇺🇬 Ugandan Sports News</option>
                                        <option value="international">🌍 International Sports News</option>
                                        <option value="players">⭐ Player Profile Story</option>
                                        <option value="tips">💎 VIP Betting Tip</option>
                                        <option value="news-link">🔗 Newspaper / External News Link (Auto Reader)</option>
                                    </select>
                                </div>

                                <input type="text" x-model="postPayload.title" placeholder="Story Headline Title" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition">
                                <input type="url" x-model="postPayload.media_url" placeholder="Media URL (.mp4 video, image, GIF, or newspaper link)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition">
                                
                                <div>
                                    <label class="text-[10px] text-slate-400 font-extrabold uppercase block mb-1 tracking-wider">Story Body Commentary</label>
                                    <textarea x-model="postPayload.body" rows="4" placeholder="Type or paste the complete body of the story here..." required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition"></textarea>
                                </div>

                                <div class="flex gap-2">
                                    <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl text-xs transition duration-200 shadow-lg" x-text="postPayload.id ? '💾 Save Changes' : '🚀 Publish Live to Portal'"></button>
                                    <template x-if="postPayload.id">
                                        <button type="button" @click="resetPostForm" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-3.5 rounded-xl text-xs transition">Cancel</button>
                                    </template>
                                </div>
                            </form>

                            <template x-if="userRole === 'admin'">
                                <div class="space-y-6">
                                    <div class="space-y-4 bg-slate-950 p-5 rounded-2xl border border-indigo-500/30">
                                        <h3 class="text-sm font-bold text-indigo-400">Manage Content Bloggers (No Admin Rights)</h3>
                                        <form @submit.prevent="createBlogger" class="space-y-3">
                                            <input type="text" x-model="bloggerForm.username" placeholder="New Blogger Username" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500 transition">
                                            <input type="password" x-model="bloggerForm.pin" placeholder="Blogger Security PIN / Password" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-indigo-500 transition">
                                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition duration-200 shadow-md">Register New Blogger Account</button>
                                        </form>

                                        <div class="mt-4 space-y-2">
                                            <div class="text-[10px] text-slate-400 uppercase font-extrabold tracking-wider">Active Bloggers List</div>
                                            <template x-for="b in data.users" :key="b.id">
                                                <div class="flex justify-between items-center bg-slate-900 border border-slate-800 px-3.5 py-2.5 rounded-xl text-xs">
                                                    <div>
                                                        <span class="text-slate-200 font-bold" x-text="b.username"></span>
                                                        <span class="text-[10px] text-slate-500 ml-2 uppercase font-semibold" x-text="'(' + b.role + ')'"></span>
                                                    </div>
                                                    <template x-if="b.role === 'blogger'">
                                                        <button @click="deleteBlogger(b.id)" class="text-red-400 hover:text-red-300 font-bold text-[10px] transition">Revoke Account</button>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <div class="space-y-4 bg-slate-950 p-5 rounded-2xl border border-amber-500/30">
                                        <h3 class="text-sm font-bold text-amber-400">🔐 Password Management Suite</h3>
                                        <form @submit.prevent="updatePassword" class="space-y-3">
                                            <div>
                                                <label class="text-[10px] text-slate-400 font-extrabold uppercase block mb-1 tracking-wider">Select User Account</label>
                                                <select x-model="passwordForm.username" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 outline-none focus:border-amber-500 transition">
                                                    <option value="SuperAdmin">SuperAdmin (Master)</option>
                                                    <template x-for="b in data.users.filter(u => u.role === 'blogger')" :key="b.username">
                                                        <option :value="b.username" x-text="b.username + ' (Blogger)'"></option>
                                                    </template>
                                                </select>
                                            </div>
                                            <input type="password" x-model="passwordForm.new_pin" placeholder="New Password / PIN" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 transition">
                                            <input type="password" x-model="passwordForm.confirm_pin" placeholder="Confirm New Password / PIN" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 transition">
                                            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition duration-200 shadow-md">Update Account Password</button>
                                        </form>
                                    </div>
                                </div>
                            </template>

                            <template x-if="userRole === 'admin'">
                                <form @submit.prevent="deployAdvert" class="space-y-4 bg-slate-950 p-5 rounded-2xl border border-amber-500/30">
                                    <h3 class="text-sm font-bold text-amber-400">Deploy Permanent Side Advert</h3>
                                    <input type="text" x-model="adPayload.title" placeholder="Sponsor Brand Name" required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 transition">
                                    <input type="url" x-model="adPayload.media_url" placeholder="Optional Ad Media URL (.mp4 video, image, or GIF)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 transition">
                                    <textarea x-model="adPayload.body" rows="3" placeholder="Sponsor text commentary or promotion details..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 transition"></textarea>
                                    <input type="url" x-model="adPayload.target_url" placeholder="Destination Landing Link URL (Optional)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-500 transition">
                                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition duration-200 shadow-md">Pin Universal Side Ad</button>
                                </form>
                            </template>
                        </div>
                    </template>
                </div>
            </section>
        </main>

        <aside class="space-y-4 order-3">
            <div class="lg:sticky lg:top-24 space-y-4">
                <div class="text-[10px] uppercase font-extrabold text-slate-500 tracking-widest text-center">Featured Promotions</div>
                <template x-for="ad in data.adverts" :key="'right-' + ad.id">
                    <div class="bg-gradient-to-b from-slate-900 to-slate-900/80 border border-slate-800/80 rounded-2xl p-4 space-y-3 shadow-xl relative group overflow-hidden">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-amber-500/5 rounded-full blur-2xl group-hover:bg-amber-500/10 transition"></div>
                        <div class="flex justify-between items-center text-[10px] font-bold text-amber-400 uppercase tracking-wider relative z-10">
                            <span x-text="ad.title"></span>
                            <span class="bg-amber-950/80 px-2 py-0.5 rounded border border-amber-800/40 text-amber-300">Ad</span>
                        </div>
                        <template x-if="ad.media_url">
                            <div class="overflow-hidden rounded-xl border border-slate-800 bg-slate-950 relative z-10 shadow-inner">
                                <template x-if="ad.media_url.endsWith('.mp4') || ad.media_url.includes('video')">
                                    <video :src="ad.media_url" autoplay muted loop playsinline class="w-full h-40 object-cover"></video>
                                </template>
                                <template x-if="!ad.media_url.endsWith('.mp4') && !ad.media_url.includes('video')">
                                    <img :src="ad.media_url" :alt="ad.title" loading="lazy" class="w-full h-40 object-cover group-hover:scale-105 transition duration-500">
                                </template>
                            </div>
