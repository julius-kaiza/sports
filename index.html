<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ProPulse Sports Portal — Ugandan and international sports news, player profiles, live updates and premium sports content."
    >

    <meta
        name="theme-color"
        content="#020617"
    >

    <title>ProPulse Sports Portal | Uganda & International Sports Hub</title>

    <!-- Open Graph -->
    <meta
        property="og:title"
        content="ProPulse Sports Portal | Live News & Updates"
    >

    <meta
        property="og:description"
        content="Catch the latest Ugandan and international sports news, player profiles, live feeds and premium sports content."
    >

    <meta
        property="og:image"
        content="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1200&auto=format&fit=crop"
    >

    <meta
        property="og:url"
        content=""
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
        [x-cloak] {
            display: none !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
        }

        ::selection {
            background: #f59e0b;
            color: #020617;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 5px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 999px;
        }
    </style>
</head>

<body
    class="bg-slate-950 text-slate-100 pb-32 font-sans antialiased"
    x-data="sportsPortal()"
    x-init="init()"
    x-cloak
>

<!-- =========================================================
     HEADER
========================================================= -->

<header
    class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 shadow-2xl"
>
    <div
        class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col xl:flex-row justify-between items-center gap-4"
    >

        <!-- BRAND -->

        <button
            type="button"
            @click="activeTab = 'feed'"
            class="text-2xl font-black tracking-wider flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-amber-500 rounded-xl px-2 py-1"
            aria-label="Go to ProPulse live feed"
        >
            <span class="text-amber-400">PRO</span>
            <span class="text-white">PULSE</span>

            <span
                class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full font-semibold"
            >
                LIVE HUB
            </span>
        </button>

        <!-- NAVIGATION -->

        <nav
            class="flex flex-wrap justify-center gap-2 text-xs font-bold uppercase tracking-wide"
            aria-label="Main navigation"
        >

            <template x-for="tab in navigationTabs" :key="tab.id">

                <button
                    type="button"
                    @click="selectTab(tab.id)"
                    :aria-current="activeTab === tab.id ? 'page' : null"
                    :class="activeTab === tab.id
                        ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 scale-105'
                        : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700 hover:text-white'"
                    class="px-3.5 py-2 rounded-xl transition duration-200 focus:outline-none focus:ring-2 focus:ring-amber-500"
                    x-text="tab.label"
                ></button>

            </template>

        </nav>
    </div>
</header>


<!-- =========================================================
     GLOBAL LOADING BAR
========================================================= -->

<div
    x-show="loading"
    x-transition
    class="fixed top-0 left-0 right-0 h-1 bg-amber-500 z-[100]"
>
    <div class="h-full bg-white/50 animate-pulse"></div>
</div>


<!-- =========================================================
     MAIN LAYOUT
========================================================= -->

<div
    class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-4 gap-6"
>

    <!-- =====================================================
        LEFT SIDEBAR (Sponsored Partners)
     ====================================================== -->

    <aside class="space-y-4 order-2 lg:order-1">

        <div class="lg:sticky lg:top-24 space-y-4">

            <div
                class="text-[10px] uppercase font-extrabold text-slate-500 tracking-widest text-center"
            >
                Sponsored Partners
            </div>

            <!-- EMPTY ADS -->

            <template x-if="!data.adverts.length">

                <div
                    class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 text-center"
                >
                    <div class="text-2xl mb-2">📢</div>

                    <p class="text-xs text-slate-500">
                        Sponsored placements will appear here.
                    </p>
                </div>

            </template>


            <!-- ADS -->

            <template
                x-for="ad in data.adverts"
                :key="'left-' + ad.id"
            >

                <div
                    class="bg-gradient-to-b from-slate-900 to-slate-900/80 border border-slate-800/80 rounded-2xl p-4 space-y-3 shadow-xl relative group overflow-hidden"
                >

                    <div
                        class="absolute top-0 right-0 w-24 h-24 bg-amber-500/5 rounded-full blur-2xl group-hover:bg-amber-500/10 transition"
                    ></div>

                    <div
                        class="flex justify-between items-center text-[10px] font-bold text-amber-400 uppercase tracking-wider relative z-10"
                    >
                        <span x-text="ad.title"></span>

                        <span
                            class="bg-amber-950/80 px-2 py-0.5 rounded border border-amber-800/40 text-amber-300"
                        >
                            Ad
                        </span>
                    </div>

                    <!-- MEDIA -->

                    <template x-if="hasMedia(ad.media_url)">

                        <div
                            class="overflow-hidden rounded-xl border border-slate-800 bg-slate-950 relative z-10 shadow-inner"
                        >

                            <template x-if="isVideo(ad.media_url)">

                                <video
                                    :src="safeUrl(ad.media_url)"
                                    autoplay
                                    muted
                                    loop
                                    playsinline
                                    preload="metadata"
                                    class="w-full h-40 object-cover"
                                ></video>

                            </template>

                            <template x-if="!isVideo(ad.media_url)">

                                <img
                                    :src="safeUrl(ad.media_url)"
                                    :alt="ad.title || 'Advertisement'"
                                    loading="lazy"
                                    class="w-full h-40 object-cover group-hover:scale-105 transition duration-500"
                                >

                            </template>

                        </div>

                    </template>

                    <p
                        class="text-xs text-slate-300 leading-relaxed relative z-10"
                        x-text="ad.body || ''"
                    ></p>

                    <template
                        x-if="isValidHttpUrl(ad.target_url)"
                    >

                        <a
                            :href="safeUrl(ad.target_url)"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="block text-center bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs py-2.5 rounded-xl transition duration-200 shadow-md relative z-10"
                        >
                            Visit Sponsor ➔
                        </a>

                    </template>

                    <!-- MANAGEMENT FOR ADVERTS -->
                    <template x-if="isLoggedIn && userRole === 'admin'">
                        <div class="flex gap-2 mt-3 pt-2 border-t border-slate-800/60">
                            <!-- Edit Button -->
                            <button 
                                type="button"
                                @click="editAdvert(ad)" 
                                class="flex-1 bg-blue-950/80 hover:bg-blue-900 text-blue-400 text-xs px-3 py-1.5 rounded-lg border border-blue-800/40 font-bold transition text-center"
                            >
                                Edit Ad
                            </button>
                            
                            <!-- Remove Button -->
                            <button
                                type="button"
                                @click="deleteAdvert(ad.id)"
                                class="flex-1 bg-red-950/80 hover:bg-red-900 text-red-400 text-xs px-3 py-1.5 rounded-lg border border-red-800/40 font-bold transition text-center"
                            >
                                Remove Ad
                            </button>
                        </div>
                    </template>
                    
                </div>

            </template>

        </div>

    </aside>

    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main
        class="lg:col-span-2 space-y-6 order-1 lg:order-2"
    >

        <!-- =================================================
             CONTENT FEED
        ================================================== -->

        <section
            x-show="activeTab !== 'tips' && activeTab !== 'admin'"
            x-transition
            class="space-y-6"
        >

            <!-- EMPTY STATE -->

            <template x-if="!filteredPosts.length && !loading">

                <div
                    class="bg-slate-900/90 border border-slate-800 rounded-3xl p-10 text-center shadow-xl"
                >

                    <div class="text-5xl mb-4">🏟️</div>

                    <h2
                        class="text-xl font-black text-white"
                    >
                        No stories available
                    </h2>

                    <p
                        class="text-sm text-slate-500 mt-2"
                    >
                        New sports stories and updates will appear here.
                    </p>

                </div>

            </template>


            <!-- POSTS -->

            <template
                x-for="item in filteredPosts"
                :key="item.id"
            >

                <article
                    class="bg-slate-900/90 backdrop-blur border border-slate-800/80 p-6 rounded-3xl space-y-4 shadow-2xl relative group hover:border-slate-700 transition duration-300"
                >

                    <!-- POST HEADER -->

                    <div class="flex justify-between items-center text-xs gap-3">

                        <span
                            class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-full font-black uppercase tracking-wider text-[10px]"
                            x-text="formatPostType(item.type)"
                        ></span>

                        <span
                            class="text-emerald-400 font-bold flex items-center gap-1.5 bg-emerald-950/40 border border-emerald-800/30 px-2.5 py-1 rounded-full text-[11px]"
                        >

                            <span
                                class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"
                            ></span>

                            <span
                                x-text="'By ' + (item.author || 'ProPulse')"
                            ></span>

                        </span>

                    </div>


                    <!-- TITLE -->

                    <h2
                        class="text-xl md:text-2xl font-black text-white tracking-tight leading-snug group-hover:text-amber-300 transition"
                        x-text="item.title"
                    ></h2>


                    <!-- MEDIA -->

                    <template
                        x-if="item.media_url && item.type !== 'news-link'"
                    >

                        <div
                            class="overflow-hidden rounded-2xl border border-slate-800/80 bg-slate-950 shadow-inner"
                        >

                            <template x-if="isVideo(item.media_url)">

                                <video
                                    :src="safeUrl(item.media_url)"
                                    controls
                                    playsinline
                                    preload="metadata"
                                    class="w-full max-h-[480px] object-cover"
                                ></video>

                            </template>

                            <template x-if="!isVideo(item.media_url)">

                                <img
                                    :src="safeUrl(item.media_url)"
                                    :alt="item.title || 'Sports story image'"
                                    loading="lazy"
                                    class="w-full max-h-[480px] object-cover group-hover:scale-[1.02] transition duration-700"
                                >

                            </template>

                        </div>

                    </template>


                    <!-- EXTERNAL NEWS -->

                    <template x-if="item.type === 'news-link'">

                        <div
                            class="bg-slate-950/90 border border-slate-800 p-5 rounded-2xl space-y-3 shadow-inner"
                        >

                            <div
                                class="flex items-center gap-2 text-amber-400 text-xs font-bold uppercase tracking-wider"
                            >
                                <span>🌐 External Newspaper Article</span>
                            </div>

                            <h3
                                class="text-base font-bold text-white"
                                x-text="item.title"
                            ></h3>

                            <p
                                class="text-xs text-slate-300 line-clamp-3 leading-relaxed"
                                x-text="item.body"
                            ></p>

                            <template
                                x-if="isValidHttpUrl(item.media_url)"
                            >

                                <a
                                    :href="safeUrl(item.media_url)"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black px-4 py-2.5 rounded-xl transition duration-200 shadow-md"
                                >
                                    Read Full Story on Source Site ➔
                                </a>

                            </template>

                        </div>

                    </template>


                    <!-- BODY -->

                    <p
                        x-show="item.type !== 'news-link'"
                        class="text-sm text-slate-300 whitespace-pre-line leading-relaxed font-normal"
                        x-text="item.body"
                    ></p>


                    <!-- POST FOOTER -->

                    <div
                        class="pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-3 text-xs"
                    >

                        <div class="flex items-center gap-2">

                            <!-- WHATSAPP -->

                            <a
                                :href="storyWhatsAppUrl(item)"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-slate-950 font-bold px-3 py-2 rounded-xl border border-emerald-500/30 flex items-center gap-1.5 transition duration-200 shadow-sm"
                            >
                                <span>💬</span>
                                <span>WhatsApp</span>
                            </a>


                            <!-- SHARE -->

                            <button
                                type="button"
                                @click="shareStory(item)"
                                class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-2 rounded-xl border border-slate-700 flex items-center gap-1.5 transition duration-200"
                            >
                                <span>🔗</span>
                                <span>Share</span>
                            </button>

                        </div>


                        <!-- MANAGEMENT -->

                        <template
                            x-if="isLoggedIn && (userRole === 'admin' || currentUsername === item.author)"
                        >

                            <div class="flex gap-2">

                                <template x-if="userRole === 'admin'">

                                    <button
                                        type="button"
                                        @click="editPost(item)"
                                        class="bg-amber-950/80 hover:bg-amber-900 text-amber-400 text-xs px-3 py-1.5 rounded-lg border border-amber-800/40 font-bold transition"
                                    >
                                        Edit
                                    </button>

                                </template>

                                <button
                                    type="button"
                                    @click="deletePost(item.id)"
                                    class="bg-red-950/80 hover:bg-red-900 text-red-400 text-xs px-3 py-1.5 rounded-lg border border-red-800/40 font-bold transition"
                                >
                                    Delete
                                </button>

                            </div>

                        </template>

                    </div>

                </article>

            </template>

        </section>


        <!-- =================================================
             VIP TIPS
        ================================================== -->

        <section
            x-show="activeTab === 'tips'"
            x-transition
            class="space-y-6"
        >

            <div
                class="bg-gradient-to-br from-slate-900 to-slate-950 border border-amber-500/40 p-8 rounded-3xl text-center space-y-4 shadow-2xl relative overflow-hidden"
            >

                <div
                    class="absolute -top-12 -right-12 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl"
                ></div>

                <span
                    class="text-xs bg-amber-950 text-amber-400 border border-amber-800/40 px-3 py-1 rounded-full font-extrabold uppercase tracking-widest"
                >
                    VIP Accumulator Hub
                </span>

                <h2
                    class="text-2xl md:text-3xl font-black text-white tracking-tight"
                >
                    Unlock Premium Sports Content
                </h2>

                <p
                    class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed"
                >
                    Secure payment access can be connected to your production
                    Google Pay payment processor.
                </p>

                <button
                    type="button"
                    @click="triggerGooglePay"
                    class="bg-white hover:bg-slate-200 text-slate-950 font-black px-8 py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2 mx-auto transition duration-200 shadow-xl hover:scale-105"
                >
                    <span>🌐 Pay Securely with Google Pay</span>
                </button>

            </div>

        </section>


        <!-- =================================================
             ADMIN STUDIO
        ================================================== -->

        <section
            x-show="activeTab === 'admin'"
            x-transition
            class="space-y-6"
        >

            <div
                class="bg-slate-900 border border-amber-500/40 p-6 rounded-3xl shadow-xl space-y-6"
            >

                <!-- LOGIN -->

                <template x-if="!isLoggedIn">

                    <div class="space-y-4 text-center py-4">

                        <h2
                            class="text-xl font-black text-white"
                        >
                            Studio Control Center
                        </h2>

                        <p
                            class="text-xs text-slate-400 leading-relaxed"
                        >
                            Accessible from phone, tablet and PC.
                            <br>
                            Please enter your administrator or blogger credentials.
                        </p>

                        <form
                            @submit.prevent="login"
                            class="space-y-3 text-left max-w-md mx-auto"
                        >

                            <label
                                class="block text-[10px] text-slate-400 font-bold uppercase"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                x-model.trim="loginForm.username"
                                placeholder="Username"
                                autocomplete="username"
                                required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition"
                            >

                            <label
                                class="block text-[10px] text-slate-400 font-bold uppercase"
                            >
                                Password / PIN
                            </label>

                            <input
                                type="password"
                                x-model="loginForm.pin"
                                placeholder="PIN Code / Password"
                                autocomplete="current-password"
                                required
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition"
                            >

                            <button
                                type="submit"
                                :disabled="loading"
                                class="w-full bg-amber-500 hover:bg-amber-400 disabled:opacity-50 disabled:cursor-not-allowed text-slate-950 font-black py-3.5 rounded-xl text-xs transition shadow-lg"
                            >
                                <span
                                    x-text="loading ? 'Authenticating...' : 'Authenticate Access'"
                                ></span>
                            </button>

                        </form>

                    </div>

                </template>


                <!-- LOGGED IN -->

                <template x-if="isLoggedIn">

                    <div class="space-y-6">

                        <!-- SESSION HEADER -->

                        <div
                            class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-800 pb-4"
                        >

                            <div>

                                <span
                                    class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800/40 px-2.5 py-1 rounded font-black uppercase tracking-wider"
                                    x-text="userRole"
                                ></span>

                                <h2
                                    class="text-lg font-black text-white mt-2"
                                    x-text="'Welcome, ' + currentUsername"
                                ></h2>

                            </div>

                            <button
                                type="button"
                                @click="logout"
                                class="bg-red-950 hover:bg-red-900 text-red-400 text-xs px-3.5 py-2 rounded-xl border border-red-800/40 font-bold transition"
                            >
                                Sign Out
                            </button>

                        </div>


                        <!-- =================================================
                             CONTENT PUBLISHER
                        ================================================== -->

                        <form
                            @submit.prevent="publishContent"
                            class="space-y-4 bg-slate-950 p-5 rounded-2xl border border-slate-800 shadow-inner"
                        >

                            <div
                                class="flex justify-between items-center gap-3"
                            >

                                <h3
                                    class="text-sm font-bold text-white tracking-wide"
                                    x-text="postPayload.id ? 'Edit Story / Video' : 'Publish Story, Video, or Newspaper Link'"
                                ></h3>

                                <template x-if="postPayload.id">

                                    <span
                                        class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-1 rounded-lg"
                                    >
                                        EDIT MODE
                                    </span>

                                </template>

                            </div>


                            <!-- CATEGORY -->

                            <div>

                                <label
                                    class="text-[10px] text-slate-400 font-extrabold uppercase block mb-1 tracking-wider"
                                >
                                    Select Category
                                </label>

                                <select
                                    x-model="postType"
                                    class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 outline-none focus:border-amber-500 transition"
                                >

                                    <option value="uganda">
                                        🇺🇬 Ugandan Sports News
                                    </option>

                                    <option value="international">
                                        🌍 International Sports News
                                    </option>

                                    <option value="players">
                                        ⭐ Player Profile Story
                                    </option>

                                    <option value="tips">
                                        💎 VIP Sports Content
                                    </option>

                                    <option value="news-link">
                                        🔗 Newspaper / External News Link
                                    </option>

                                </select>

                            </div>


                            <!-- TITLE -->

                            <input
                                type="text"
                                x-model.trim="postPayload.title"
                                placeholder="Story Headline Title"
                                required
                                maxlength="500"
                                class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition"
                            >


                            <!-- MEDIA -->

                            <div>

                                <label
                                    class="text-[10px] text-slate-400 font-extrabold uppercase block mb-1 tracking-wider"
                                >
                                    Media / Source URL
                                </label>

                                <input
                                    type="url"
                                    x-model.trim="postPayload.media_url"
                                    placeholder="Image, GIF, MP4 or newspaper URL"
                                    class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition"
                                >

                            </div>


                            <!-- BODY -->

                            <div>

                                <label
                                    class="text-[10px] text-slate-400 font-extrabold uppercase block mb-1 tracking-wider"
                                >
                                    Story Body Commentary
                                </label>

                                <textarea
                                    x-model="postPayload.body"
                                    rows="6"
                                    placeholder="Type or paste the complete body of the story here..."
                                    required
                                    class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-xs text-white outline-none focus:border-amber-500 transition resize-y"
                                ></textarea>

                            </div>


                            <!-- ACTIONS -->

                            <div class="flex gap-2">

                                <button
                                    type="submit"
                                    :disabled="loading"
                                    class="flex-1 bg-amber-500 hover:bg-amber-400 disabled:opacity-50 disabled:cursor-not-allowed text-slate-950 font-black py-3.5 rounded-xl text-xs transition duration-200 shadow-lg"
                                >

                                    <span
                                        x-text="loading
                                            ? 'Saving...'
                                            : (postPayload.id
                                                ? '💾 Save Changes'
                                                : '🚀 Publish Live to Portal')"
                                    ></span>

                                </button>

                                <template x-if="postPayload.id">

                                    <button
                                        type="button"
                                        @click="resetPostForm"
                                        class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-3.5 rounded-xl text-xs transition"
                                    >
                                        Cancel
                                    </button>

                                </template>

                            </div>

                        </form>


                        <!-- =================================================
                             WHATSAPP SETTINGS
                        ================================================== -->

                        <template x-if="userRole === 'admin'">

                            <div
                                class="space-y-4 bg-slate-950 p-5 rounded-2xl border border-emerald-500/30"
                            >

                                <h3
                                    class="text-sm font-bold text-emerald-400"
                                >
                                    📱 WhatsApp Integration Settings

<script>
/* =========================================================
   PROPULSE SPORTS PORTAL
   FRONTEND APPLICATION
========================================================= */

function sportsPortal() {

    return {

        /* =====================================================
           APPLICATION STATE
        ===================================================== */

        activeTab: 'feed',

        isLoggedIn: false,

        currentUsername: '',

        userRole: '',

        loading: false,

        postType: 'uganda',

        navigationTabs: [
            {
                id: 'feed',
                label: '🔥 Live Feed'
            },
            {
                id: 'uganda',
                label: '🇺🇬 Ugandan Sports'
            },
            {
                id: 'international',
                label: '🌍 International'
            },
            {
                id: 'players',
                label: '⭐ Player Profiles'
            },
            {
                id: 'tips',
                label: '💎 VIP Tips'
            },
            {
                id: 'admin',
                label: '⚙️ Admin / Studio'
            }
        ],

        loginForm: {
            username: '',
            pin: ''
        },

        postPayload: {
            id: null,
            title: '',
            media_url: '',
            body: ''
        },

        bloggerForm: {
            username: '',
            pin: ''
        },

        passwordForm: {
            username: 'SuperAdmin',
            new_pin: '',
            confirm_pin: ''
        },

        whatsappSettings: {
            phone: '256700000000',
            message: 'Hello ProPulse Sports, I am reaching out from your live portal!'
        },

        adPayload: {
            title: '',
            media_url: '',
            body: '',
            target_url: ''
        },

        data: {
            users: [],
            posts: [],
            adverts: []
        },

        toast: {
            visible: false,
            message: '',
            type: 'success',
            timer: null
        },


        /* =====================================================
           INITIALIZATION
        ===================================================== */

        async init() {

            await this.loadContent();

            await this.restoreSession();

        },


        /* =====================================================
           API HELPER
        ===================================================== */

        async api(url, options = {}) {

            const requestOptions = {
                credentials: 'include',
                ...options,
                headers: {
                    Accept: 'application/json',
                    ...(options.body
                        ? { 'Content-Type': 'application/json' }
                        : {}),
                    ...(options.headers || {})
                }
            };

            try {

                const response = await fetch(
                    url,
                    requestOptions
                );

                let result = {};

                const contentType =
                    response.headers.get('content-type') || '';

                if (
                    contentType.includes('application/json')
                ) {

                    try {
                        result = await response.json();
                    } catch {
                        result = {};
                    }

                } else {

                    const text =
                        await response.text();

                    if (text) {
                        result = {
                            message: text
                        };
                    }

                }


                if (!response.ok) {

                    if (response.status === 401) {

                        this.clearSession();

                    }

                    throw new Error(
                        result.error ||
                        result.message ||
                        `Request failed (${response.status})`
                    );
                }


                return result;

            } catch (error) {

                console.error(
                    '[ProPulse API]',
                    error
                );

                throw error;
            }
        },


        /* =====================================================
           LOAD CONTENT
        ===================================================== */

        async loadContent(options = {}) {

            const showErrors =
                options.showErrors !== false;

            this.loading = true;

            try {

                const result =
                    await this.api('/api/content');


                this.data.posts =
                    Array.isArray(result.all_posts)
                        ? result.all_posts
                        : [];


                this.data.adverts =
                    Array.isArray(result.adverts)
                        ? result.adverts
                        : [];


                this.data.users =
                    Array.isArray(result.users)
                        ? result.users
                        : [];


                if (result.settings) {

                    this.whatsappSettings.phone =
                        result.settings.whatsapp_phone ||
                        this.whatsappSettings.phone;


                    this.whatsappSettings.message =
                        result.settings.whatsapp_message ||
                        this.whatsappSettings.message;

                }


                return true;

            } catch (error) {

                console.error(
                    'Unable to load portal content:',
                    error
                );

                if (showErrors) {

                    this.showToast(
                        error.message ||
                        'Unable to load portal data.',
                        'error'
                    );

                }

                return false;

            } finally {

                this.loading = false;

            }
        },


        /* =====================================================
           SESSION
        ===================================================== */

        async restoreSession() {

            try {

                const result =
                    await this.api('/api/auth/me');

                if (result && result.success) {

                    this.isLoggedIn = true;

                    this.currentUsername =
                        result.username || '';

                    this.userRole =
                        result.role || '';

                } else {

                    this.clearSession();

                }

            } catch {

                this.clearSession();

            }
        },


        clearSession() {

            this.isLoggedIn = false;

            this.currentUsername = '';

            this.userRole = '';

        },


        /* =====================================================
           NAVIGATION
        ===================================================== */

        selectTab(tab) {

            this.activeTab = tab;

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        },


        /* =====================================================
           FILTERED POSTS
        ===================================================== */

        get filteredPosts() {

            if (this.activeTab === 'feed') {

                return this.data.posts;

            }

            return this.data.posts.filter(
                post =>
                    post.type === this.activeTab
            );

        },


        /* =====================================================
           BLOGGER USERS
        ===================================================== */

        get bloggerUsers() {

            return this.data.users.filter(
                user =>
                    user.role === 'blogger'
            );

        },


        /* =====================================================
           WHATSAPP
        ===================================================== */

        get whatsappLinkAvailable() {

            return Boolean(
                this.cleanPhone(
                    this.whatsappSettings.phone
                )
            );

        },


        get whatsappChatUrl() {

            const phone =
                this.cleanPhone(
                    this.whatsappSettings.phone
                );

            const message =
                this.whatsappSettings.message ||
                'Hello ProPulse Sports!';


            if (!phone) {

                return '#';

            }


            return (
                'https://wa.me/' +
                phone +
                '?text=' +
                encodeURIComponent(message)
            );

        },


        cleanPhone(phone) {

            return String(
                phone || ''
            ).replace(
                /\D/g,
                ''
            );

        },


        storyWhatsAppUrl(item) {

            const phone =
                this.cleanPhone(
                    this.whatsappSettings.phone
                );


            const text =
                '🔥 *' +
                (item.title || 'ProPulse Sports Story') +
                '*\n\n' +
                'Read more on ProPulse Sports Portal:\n' +
                window.location.href;


            if (!phone) {

                return (
                    'https://api.whatsapp.com/send?text=' +
                    encodeURIComponent(text)
                );

            }


            return (
                'https://wa.me/' +
                phone +
                '?text=' +
                encodeURIComponent(text)
            );

        },


        /* =====================================================
           LOGIN
        ===================================================== */

        async login() {

            if (
                !this.loginForm.username ||
                !this.loginForm.pin
            ) {

                this.showToast(
                    'Enter your username and password.',
                    'error'
                );

                return;

            }


            this.loading = true;

            try {

                const result =
                    await this.api(
                        '/api/auth/login',
                        {
                            method: 'POST',

                            body: JSON.stringify({
                                username:
                                    this.loginForm.username,

                                pin:
                                    this.loginForm.pin
                            })
                        }
                    );


                if (!result.success) {

                    throw new Error(
                        result.message ||
                        result.error ||
                        'Authentication failed.'
                    );

                }


                this.isLoggedIn = true;

                this.currentUsername =
                    result.username || '';

                this.userRole =
                    result.role || '';


                this.loginForm.username = '';

                this.loginForm.pin = '';


                await this.loadContent({
                    showErrors: false
                });


                this.showToast(
                    'Authentication successful.',
                    'success'
                );


            } catch (error) {

                this.showToast(
                    error.message ||
                    'Invalid username or password.',
                    'error'
                );

            } finally {

                this.loading = false;

            }
        },


        /* =====================================================
           LOGOUT
        ===================================================== */

        async logout() {

            try {

                await this.api(
                    '/api/auth/logout',
                    {
                        method: 'POST'
                    }
                );

            } catch (error) {

                console.error(
                    'Logout error:',
                    error
                );

            } finally {

                this.clearSession();

                this.activeTab = 'feed';

                this.resetPostForm();

                this.showToast(
                    'You have been signed out.',
                    'success'
                );

            }

        },


        /* =====================================================
           PUBLISH / UPDATE
        ===================================================== */

        async publishContent() {

            const title =
                String(
                    this.postPayload.title || ''
                ).trim();

            const body =
                String(
                    this.postPayload.body || ''
                ).trim();

            if (!title || !body) {

                this.showToast(
                    'Story title and body are required.',
                    'error'
                );

                return;

            }


            const editing =
                Boolean(
                    this.postPayload.id
                );


            this.loading = true;

            try {

                const result =
                    await this.api(
                        '/api/admin/publish',
                        {
                            method: 'POST',

                            body: JSON.stringify({

                                id:
                                    this.postPayload.id,

                                type:
                                    this.postType,

                                category:
                                    this.postType,

                                title,

                                media_url:
                                    String(
                                        this.postPayload.media_url || ''
                                    ).trim(),

                                body

                            })
                        }
                    );


                if (!result.success) {

                    throw new Error(
                        result.message ||
                        result.error ||
                        'Unable to save story.'
                    );

                }


                await this.loadContent({
                    showErrors: false
                });


                this.resetPostForm();


                this.showToast(
                    editing
                        ? 'Story successfully updated.'
                        : 'Content successfully published to the portal.',
                    'success'
                );


            } catch (error) {

                this.showToast(
                    error.message ||
                    'Unable to save story.',
                    'error'
                );

            } finally {

                this.loading = false;

            }

        },


        /* =====================================================
           EDIT POST
        ===================================================== */

        editPost(item) {

            if (!item) {
                return;
            }


            this.postPayload = {

                id:
                    item.id || null,

                title:
                    item.title || '',

                media_url:
                    item.media_url || '',

                body:
                    item.body || ''

            };


            this.postType =
                item.type || 'uganda';


            this.activeTab = 'admin';


            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

        },


        /* =====================================================
           DELETE POST
        ===================================================== */

        async deletePost(id) {

            if (!id) {

                this.showToast(
                    'Invalid story identifier.',
                    'error'
                );

                return;

            }


            if (
                !window.confirm(
                    'Are you sure you want to delete this story? This action cannot be undone.'
                )
            ) {

                return;

            }


            this.loading = true;

            try {

                await this.api(

                        method: 'DELETE'
                    }
                );


                await this.loadContent({
                    showErrors: false
                });


                this.showToast(
                    'Story deleted successfully.',
                    'success'
                );


            } catch (error) {

                this.showToast(
                    error.message ||
                    'Unable to delete story.',
                    'error'
                );

            } finally {

                this.loading = false;

            }

        },


        /* =====================================================
           RESET POST FORM
        ===================================================== */

        resetPostForm() {

            this.postPayload = {

                id: null,

                title: '',

                media_url: '',

                body: ''

            };


            this.postType = 'uganda';

        },


        /* =====================================================
           CREATE BLOGGER
        ===================================================== */

        async createBlogger() {

                String(
                    this.bloggerForm.username || ''
                ).trim();

            const pin =

                    this.bloggerForm.pin || ''
                );


            if (!username || !pin) {

                this.showToast(
                    'Enter a username and password.',
                    'error'
                );

                return;

            }


            this.loading = true;

            try {

                const result =
                    await this.api(
                        '/api/admin/bloggers',
                        {
                            method: 'POST',

                            body: JSON.stringify({
                                username,
                                pin
                            })
                        }

                    error.message ||

                );

            } finally {

                this.loading = false;

            }

        },


        /* =====================================================
           DELETE BLOGGER
        ===================================================== */

        async deleteBlogger(id) {

                return;

            }

        /* =====================================================

        async updatePassword() {

        /* =====================================================
           DEPLOY AD
        ===================================================== */

        async deployAdvert() {

            const title =
                String(
                    this.adPayload.title || ''
                ).trim();


            if (!title) {

                this.showToast(
                    'Sponsor brand name is required.',
                    'error'
                );

                return;

            }


            if (
                this.adPayload.media_url &&
                !this.isValidHttpUrl(
                    this.adPayload.media_url
                )
            ) {

                this.showToast(
                    'The advertisement media URL is invalid.',
                    'error'
                );

                return;

            }


            if (
                this.adPayload.target_url &&
                !this.isValidHttpUrl(
                    this.adPayload.target_url
                )
            ) {

                this.showToast(
                    'The advertisement destination URL is invalid.',
                    'error'
                );

                return;

            }


            this.loading = true;

            try {

                await this.api(
                    '/api/admin/adverts',
                    {
                        method: 'POST',

                        body: JSON.stringify({

                            title,

                            media_url:
                                String(
                                    this.adPayload.media_url || ''
                                ).trim(),

                            body:
                                String(
                                    this.adPayload.body || ''
                                ).trim(),

                            target_url:
                                String(
                                    this.adPayload.target_url || ''
                                ).trim(),

                            media_type:
                                this.detectMediaType(
                                    this.adPayload.media_url
                                )

                        })
                    }
                );


                this.adPayload = {

                    title: '',

                    media_url: '',

                    body: '',

                    target_url: ''

                };


                await this.loadContent({
                    showErrors: false
                });


                this.showToast(
                    'Universal side advertisement deployed.',
                    'success'
                );


            } catch (error) {

                this.showToast(
                    error.message ||
                    'Unable to deploy advertisement.',
                    'error'
                );

            } finally {

                this.loading = false;

            }

        },


        /* =====================================================
           MEDIA
        ===================================================== */

        hasMedia(url) {

            return this.isValidHttpUrl(url);

        },


        isVideo(url) {

            const value =
                String(
                    url || ''
                ).toLowerCase();


            return (
                /\.mp4(?:[?#].*)?$/.test(value) ||
                /\.webm(?:[?#].*)?$/.test(value) ||
                /\.ogg(?:[?#].*)?$/.test(value) ||
                value.includes('video')
            );

        },


        detectMediaType(url) {

            const value =
                String(
                    url || ''
                ).toLowerCase();


            if (
                /\.mp4(?:[?#].*)?$/.test(value) ||
                /\.webm(?:[?#].*)?$/.test(value) ||
                /\.ogg(?:[?#].*)?$/.test(value) ||
                value.includes('video')
            ) {

                return 'video';

            }


            if (
                /\.gif(?:[?#].*)?$/.test(value) ||
                value.includes('giphy')
            ) {

                return 'gif';

            }


            return 'image';

        },


        /* =====================================================
           URL SAFETY
        ===================================================== */

        isValidHttpUrl(value) {

            if (!value) {
                return false;
            }


            try {

                const url =
                    new URL(
                        String(value).trim()
                    );


                return (
                    url.protocol === 'https:' ||
                    url.protocol === 'http:'
                );

            } catch {

                return false;

            }

        },


        safeUrl(value) {

            if (
                !this.isValidHttpUrl(value)
            ) {

                return '#';

            }


            return String(
                value
            ).trim();

        },


        /* =====================================================
           DELETE AD
        ===================================================== */

        async deleteAdvert(id) {

                return;

        async editAdvert(ad) {

            this.editingAdvertId = ad.id;
            this.advertForm = {

        /* =====================================================
           GOOGLE PAY
        ===================================================== */

        triggerGooglePay() {

            /*
             * IMPORTANT:
             * This is intentionally left as the frontend
             * integration point.
             *
             * Your production Google Pay processor should
             * create the payment transaction and verify it
             * on the backend before premium content is unlocked.
             */

            this.showToast(
                'Google Pay payment gateway is ready for connection to your production payment processor.',
                'success'
            );

        },


        /* =====================================================
           SHARE
        ===================================================== */

        async shareStory(item) {

            const url =
                window.location.href;


            const shareData = {

                title:
                    item.title ||
                    'ProPulse Sports',

                text:
                    item.body ||
                    item.title ||
                    'Check out this story on ProPulse Sports.',

                url

            };


            try {

                if (
                    navigator.share
                ) {

                    await navigator.share(
                        shareData
                    );

                    return;

                }


                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        url
                    );

                    this.showToast(
                        'Story link copied to clipboard.',
                        'success'
                    );

                    return;

                }


                const temporaryInput =
                    document.createElement('input');

                temporaryInput.value =
                    url;

                document.body.appendChild(
                    temporaryInput
                );

                temporaryInput.select();

                document.execCommand(
                    'copy'
                );

                temporaryInput.remove();


                this.showToast(
                    'Story link copied to clipboard.',
                    'success'
                );


            } catch (error) {

                console.log(
                    'Share cancelled:',
                    error
                );

            }

        },


        /* =====================================================
           FORMATTING
        ===================================================== */

        formatPostType(type) {

            const labels = {

                uganda:
                    '🇺🇬 Ugandan Sports',

                international:
                    '🌍 International',

                players:
                    '⭐ Player Profile',

                tips:
                    '💎 VIP Content',

                'news-link':
                    '🔗 External News'

            };


            return (
                labels[type] ||
                type ||
                'Sports'
            );

        },


        /* =====================================================
           TOAST SYSTEM
        ===================================================== */

        showToast(
            message,
            type = 'success'
        ) {

            clearTimeout(
                this.toast.timer
            );


            this.toast.message =
                message;

            this.toast.type =
                type;

            this.toast.visible =
                true;


            this.toast.timer =
                setTimeout(
                    () => {
                        this.hideToast();
                    },
                    4500
                );

        },


        hideToast() {

            this.toast.visible =
                false;

            clearTimeout(
                this.toast.timer
            );

        }

    };

}
